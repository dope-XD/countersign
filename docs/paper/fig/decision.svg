<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330"><rect width="1000" height="330" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"/></marker></defs><rect x="10" y="40" width="170" height="80" fill="#fff" stroke="#111111" stroke-width="1.2"/><text x="95.0" y="65.6" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">ASR segments</text><text x="95.0" y="85.6" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="16" font-weight="400" fill="#111111" text-anchor="middle">English, Hinglish,</text><text x="95.0" y="105.6" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="16" font-weight="400" fill="#111111" text-anchor="middle">Hindi</text><rect x="10" y="190" width="170" height="100" fill="#fff" stroke="#111111" stroke-width="1.2"/><text x="95.0" y="215.6" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">Phone context</text><text x="95.0" y="235.6" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="16" font-weight="400" fill="#111111" text-anchor="middle">unknown number,</text><text x="95.0" y="255.6" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="16" font-weight="400" fill="#111111" text-anchor="middle">remote-access app,</text><text x="95.0" y="275.6" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="16" font-weight="400" fill="#111111" text-anchor="middle">caller check failed</text><rect x="230" y="14" width="300" height="126" fill="#F1F1F1" stroke="#111111" stroke-width="1.2"/><text x="380.0" y="44.8" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">Judge 1: conversation model</text><text x="380.0" y="63.5" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="400" fill="#111111" text-anchor="middle">pₜ = P(scam move so far)</text><text x="380.0" y="82.2" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="400" fill="#111111" text-anchor="middle">sₜ = mean(pₜ, pₜ₋₁)</text><text x="380.0" y="101.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="400" fill="#111111" text-anchor="middle">amber: sₜ ≥ 0.142</text><text x="380.0" y="119.8" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="400" fill="#111111" text-anchor="middle">red: sₜ ≥ 0.9855 twice in a row</text><rect x="230" y="168" width="300" height="126" fill="#F1F1F1" stroke="#111111" stroke-width="1.2"/><text x="380.0" y="198.8" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">Judge 2: cue rules</text><text x="380.0" y="217.5" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="400" fill="#111111" text-anchor="middle">19 categories, negation-aware;</text><text x="380.0" y="236.2" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="400" fill="#111111" text-anchor="middle">amber: ≥ 2 strong categories</text><text x="380.0" y="255.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="400" fill="#111111" text-anchor="middle">red: ≥ 4 incl. an action and a type;</text><text x="380.0" y="273.8" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="400" fill="#111111" text-anchor="middle">talk about scams never counts</text><rect x="580" y="70" width="210" height="176" fill="#E2E2E2" stroke="#111111" stroke-width="1.2"/><text x="685.0" y="116.4" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">Combiner</text><text x="685.0" y="135.1" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="400" fill="#111111" text-anchor="middle">amber = higher judge</text><text x="685.0" y="153.9" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="400" fill="#111111" text-anchor="middle">(cue-only amber needs</text><text x="685.0" y="172.6" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="400" fill="#111111" text-anchor="middle">Judge 1 ≥ watch)</text><text x="685.0" y="191.4" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="400" fill="#111111" text-anchor="middle">red ⇐ two independent</text><text x="685.0" y="210.1" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="400" fill="#111111" text-anchor="middle">sources agree</text><path d="M180 80 L230 80" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><path d="M205 80 L205 230 L230 230" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><path d="M180 240 L215 240 L215 116 L230 116" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><path d="M180 262 L230 262" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><path d="M530 78 L555 78 L555 130 L580 130" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><path d="M530 232 L555 232 L555 190 L580 190" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><rect x="850" y="30" width="140" height="46" fill="#E2E2E2" stroke="#111111" stroke-width="1.2"/><text x="920.0" y="58.6" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">red</text><rect x="850" y="92" width="140" height="46" fill="#F1F1F1" stroke="#111111" stroke-width="1.2"/><text x="920.0" y="120.6" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">amber</text><rect x="850" y="154" width="140" height="46" fill="#fff" stroke="#111111" stroke-width="1.2"/><text x="920.0" y="182.6" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">watch</text><rect x="850" y="216" width="140" height="46" fill="#fff" stroke="#111111" stroke-width="1.2"/><text x="920.0" y="244.6" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="16" font-weight="700" fill="#111111" text-anchor="middle">none</text><path d="M835 262 L835 30" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><path d="M790 158 L830 158" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><text x="990" y="292.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="14" font-weight="400" fill="#555555" text-anchor="end" font-style="italic">levels never decrease within a call</text><text x="990" y="310.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="14" font-weight="400" fill="#555555" text-anchor="end" font-style="italic">(except an explicit user override)</text></svg>
