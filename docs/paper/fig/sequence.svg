<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 490" width="1000" height="490"><rect width="1000" height="490" fill="#fff"/><defs><marker id="a" viewBox="0 0 10 10" refX="9.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#111111"/></marker></defs><rect x="10" y="10" width="200" height="38" fill="#E2E2E2" stroke="#111111" stroke-width="1.2"/><text x="110.0" y="34.2" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">Protected user&#x27;s phone</text><path d="M110 48 V482" stroke="#555555" stroke-width="1" stroke-dasharray="3 4"/><rect x="290" y="10" width="200" height="38" fill="#E2E2E2" stroke="#111111" stroke-width="1.2"/><text x="390.0" y="34.2" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">Relay server</text><path d="M390 48 V482" stroke="#555555" stroke-width="1" stroke-dasharray="3 4"/><rect x="540" y="10" width="200" height="38" fill="#E2E2E2" stroke="#111111" stroke-width="1.2"/><text x="640.0" y="34.2" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">Family member&#x27;s phone</text><path d="M640 48 V482" stroke="#555555" stroke-width="1" stroke-dasharray="3 4"/><rect x="790" y="10" width="200" height="38" fill="#E2E2E2" stroke="#111111" stroke-width="1.2"/><text x="890.0" y="34.2" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="15" font-weight="700" fill="#111111" text-anchor="middle">Detection server</text><path d="M890 48 V482" stroke="#555555" stroke-width="1" stroke-dasharray="3 4"/><path d="M640 80 L390 80" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><text x="515.0" y="74.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="14.5" font-weight="400" fill="#111111" text-anchor="middle">its own call events, as they happen</text><path d="M110 110 L390 110" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><text x="250.0" y="104.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="14.5" font-weight="400" fill="#111111" text-anchor="middle">call event (member id, no number)</text><path d="M110 140 L390 140" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><text x="250.0" y="134.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="14.5" font-weight="400" fill="#111111" text-anchor="middle">caller check: is that member on this call?</text><path d="M390 170 L110 170" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><text x="250.0" y="164.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="14.5" font-weight="400" fill="#111111" text-anchor="middle">verdict: not the member&#x27;s phone</text><path d="M110 215 L890 215" fill="none" stroke="#111111" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="500.0" y="209.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="14.5" font-weight="400" fill="#111111" text-anchor="middle">after amber: audio stream (memory only)</text><path d="M890 245 L110 245" fill="none" stroke="#111111" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="500.0" y="239.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="14.5" font-weight="400" fill="#111111" text-anchor="middle">verdict (may only raise the level)</text><path d="M110 290 L390 290" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><text x="250.0" y="284.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="14.5" font-weight="400" fill="#111111" text-anchor="middle">at red: scam alert (type, cue ids)</text><path d="M390 320 L640 320" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><text x="515.0" y="314.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="14.5" font-weight="400" fill="#111111" text-anchor="middle">family alarm (full screen)</text><path d="M110 350 L640 350" fill="none" stroke="#111111" stroke-width="1.3" stroke-dasharray="5 4" marker-end="url(#a)"/><text x="375.0" y="344.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="14.5" font-weight="400" fill="#111111" text-anchor="middle">SMS if the family app is offline</text><path d="M640 380 L390 380" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><text x="515.0" y="374.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="14.5" font-weight="400" fill="#111111" text-anchor="middle">acknowledged (call / message / OK)</text><path d="M390 410 L110 410" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><text x="250.0" y="404.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="14.5" font-weight="400" fill="#111111" text-anchor="middle">stop escalation; else text and call after 60 s</text><path d="M110 440 L390 440" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><text x="250.0" y="434.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="14.5" font-weight="400" fill="#111111" text-anchor="middle">false alarm: two taps</text><path d="M390 470 L640 470" fill="none" stroke="#111111" stroke-width="1.3" marker-end="url(#a)"/><text x="515.0" y="464.0" font-family="'Times New Roman', 'Nimbus Roman', Times, serif" font-size="14.5" font-weight="400" fill="#111111" text-anchor="middle">“false alarm” notice</text></svg>
